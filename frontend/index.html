<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141614'/%3E%3Crect x='15' y='34' width='7' height='15' rx='2' fill='%23a3762f'/%3E%3Crect x='28.5' y='24' width='7' height='25' rx='2' fill='%23d3a55f'/%3E%3Crect x='42' y='15' width='7' height='34' rx='2' fill='%23ecd0a0'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GFNA - A 股盘后分析、量化选股与财经新闻聚合" />
    <meta name="theme-color" content="#0f1110" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)" />

    <!-- 首屏前应用主题：默认深色，避免闪白；已手动选择过则尊重本地设置 -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('gfna-theme')
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark'
          if (!saved) localStorage.setItem('gfna-theme', theme)
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (error) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <!-- PWA manifest（Service Worker 已在 V5 移除，禁止缓存优先策略） -->
    <link rel="manifest" href="/manifest.json" />

    <title>GFNA - 盘后分析与量化选股</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
