# ============================================================
# GFNA V2 Docker Compose 编排
# 服务: PostgreSQL + FastAPI 后端 + React 前端 (Nginx)
# 启动: docker compose up -d
# 停止: docker compose down
# ============================================================
version: "3.9"

services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: postgres:16-alpine
    container_name: gfna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gfna_secret}
      POSTGRES_DB: ${POSTGRES_DATABASE:-gfna_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== FastAPI 后端 ====================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gfna-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gfna_secret}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-gfna_db}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== React 前端 (Nginx) ====================
  frontend:
    build:
      context: .
      dockerfile: frontend-v2/Dockerfile
    container_name: gfna-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
